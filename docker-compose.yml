services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-goml}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      POSTGRES_DB: ${DB_DATABASE:-goml_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  goml:
    image: goml:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-goml}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el .env}
      DB_DATABASE: ${DB_DATABASE:-goml_db}
      APP_PORT: ${APP_PORT:-3000}
      GAMES_PORT: ${GAMES_PORT:-3001}
      GUEST_REGISTER: ${GUEST_REGISTER:-true}
      SESSION_SECRET: ${SESSION_SECRET:-}
      HOST_IP: ${HOST_IP:?Falta HOST_IP en el .env}
      OWNER_USER: ${OWNER_USER:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
      - "${GAMES_PORT:-3001}:${GAMES_PORT:-3001}"
    volumes:
      - gomldata:/app/data
      - gomlcerts:/app/certs

volumes:
  pgdata:
  gomldata:
  gomlcerts: